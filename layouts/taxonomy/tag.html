{{ define "main" }}
<h1 class="p-name">Tag: {{ .Title }}</h1>
<div class="h-feed">
  {{ range .Pages }}
  <article class="h-entry">
    <h2><a class="u-url p-name" href="{{ .Permalink }}">{{ .Title }}</a></h2>
    <time class="dt-published" datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
  </article>
  {{ end }}
</div>
{{ end }}
